<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF変換ツール</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2357c6">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="PDFツール">
  <link rel="stylesheet" href="css/style.css">
  <script src="lib/jszip.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="app-header"><h1>PDF変換ツール</h1></header>
  <main>
    <section id="home" class="screen">
      <p class="lead">ファイルはこの端末の中だけで処理され、どこにも送信されません。</p>
      <nav class="home-grid">
        <a class="home-button" href="#images">画像→PDF</a>
        <a class="home-button" href="#merge">結合</a>
        <a class="home-button" href="#split">分割</a>
        <a class="home-button" href="#rotate">回転</a>
        <a class="home-button" href="#compress">圧縮</a>
      </nav>
    </section>

    <section id="images" class="screen" hidden>
      <a class="back" href="#">← 戻る</a>
      <h2>画像→PDF</h2>
      <label class="file-button">画像を選ぶ<input class="visually-hidden" type="file" accept="image/*" multiple data-role="input"></label>
      <div class="messages" data-role="messages" aria-live="polite"></div>
      <ol class="file-list" data-role="list"></ol>
      <fieldset class="options">
        <legend>ページサイズ</legend>
        <label><input type="radio" name="image-page-size" value="a4" checked> A4（画像を中央に収める・縦横は自動）</label>
        <label><input type="radio" name="image-page-size" value="fit"> 画像と同じ大きさ</label>
      </fieldset>
      <button type="button" class="primary" data-role="run" disabled>PDFを作成</button>
      <p class="status" data-role="status" aria-live="polite"></p>
    </section>

    <section id="merge" class="screen" hidden>
      <a class="back" href="#">← 戻る</a>
      <h2>結合</h2>
      <label class="file-button">PDFを選ぶ<input class="visually-hidden" type="file" accept="application/pdf,.pdf" multiple data-role="input"></label>
      <div class="messages" data-role="messages" aria-live="polite"></div>
      <ol class="file-list" data-role="list"></ol>
      <button type="button" class="primary" data-role="run" disabled>結合する</button>
      <p class="status" data-role="status" aria-live="polite"></p>
    </section>

    <section id="split" class="screen" hidden>
      <a class="back" href="#">← 戻る</a>
      <h2>分割</h2>
      <label class="file-button">PDFを選ぶ<input class="visually-hidden" type="file" accept="application/pdf,.pdf" data-role="input"></label>
      <div class="messages" data-role="messages" aria-live="polite"></div>
      <p class="info" data-role="info"></p>
      <div data-role="options" hidden>
        <fieldset class="options">
          <legend>分割の方法</legend>
          <label><input type="radio" name="split-mode" value="extract" checked> ページを選んで取り出す</label>
          <label><input type="radio" name="split-mode" value="each"> 1ページずつバラバラに</label>
          <label><input type="radio" name="split-mode" value="ranges"> 指定ページで区切る</label>
        </fieldset>
        <p class="hint" data-role="hint"></p>
        <input class="range-input" type="text" autocomplete="off" aria-label="ページの指定" data-role="range">
        <p class="range-error" data-role="range-error" aria-live="polite"></p>
      </div>
      <button type="button" class="primary" data-role="run" disabled>分割する</button>
      <p class="status" data-role="status" aria-live="polite"></p>
      <div class="page-grid" data-role="grid"></div>
    </section>

    <section id="rotate" class="screen" hidden>
      <a class="back" href="#">← 戻る</a>
      <h2>回転</h2>
      <label class="file-button">PDFを選ぶ<input class="visually-hidden" type="file" accept="application/pdf,.pdf" data-role="input"></label>
      <div class="messages" data-role="messages" aria-live="polite"></div>
      <p class="info" data-role="info"></p>
      <div class="button-row" data-role="controls" hidden>
        <button type="button" data-role="all-cw">全ページ ⟳</button>
        <button type="button" data-role="all-ccw">全ページ ⟲</button>
      </div>
      <button type="button" class="primary" data-role="run" disabled>保存</button>
      <p class="status" data-role="status" aria-live="polite"></p>
      <div class="page-grid" data-role="grid"></div>
    </section>

    <section id="compress" class="screen" hidden>
      <a class="back" href="#">← 戻る</a>
      <h2>圧縮</h2>
      <label class="file-button">PDFを選ぶ<input class="visually-hidden" type="file" accept="application/pdf,.pdf" data-role="input"></label>
      <div class="messages" data-role="messages" aria-live="polite"></div>
      <p class="info" data-role="info"></p>
      <div data-role="options" hidden>
        <fieldset class="options">
          <legend>圧縮の方法</legend>
          <label><input type="radio" name="compress-mode" value="light" checked> 画質そのまま（軽い圧縮）</label>
          <label><input type="radio" name="compress-mode" value="strong"> 強く圧縮</label>
        </fieldset>
        <fieldset class="options" data-role="levels" hidden>
          <legend>圧縮の強さ</legend>
          <label><input type="radio" name="compress-level" value="low"> 弱（きれい）</label>
          <label><input type="radio" name="compress-level" value="medium" checked> 中</label>
          <label><input type="radio" name="compress-level" value="high"> 強（小さい）</label>
          <p class="note">※ページを画像にするため、文字のコピー・検索ができなくなります。</p>
        </fieldset>
      </div>
      <button type="button" class="primary" data-role="run" disabled>圧縮する</button>
      <p class="status" data-role="status" aria-live="polite"></p>
      <div class="result" data-role="result" hidden>
        <p data-role="result-text"></p>
        <div class="result-preview" data-role="result-preview"></div>
        <button type="button" class="primary" data-role="save">保存</button>
      </div>
    </section>
  </main>
</body>
</html>
